services:
  - type: web
    name: trainingpeaks-mcp-remote
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -e . fastmcp"
    startCommand: "python proxy_server.py"
    envVars:
      # Wird NICHT im Blueprint gesetzt (sync: false = Wert manuell im Dashboard eintragen,
      # nicht im Git-Repo speichern). Der GitHub-Actions-Workflow aktualisiert ihn danach automatisch.
      - key: TP_AUTH_COOKIE
        sync: false
